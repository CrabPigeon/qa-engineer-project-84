bugreports:
- summary: |
    На мобильных разрешениях пропала панель фильтров
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-v2.hexlet.app/
    Разрешения: iPhone (390×852), Samsung (360×780)
  steps-to-reproduce: |
    1. Открыть сайт
    2. Включить Device Toolbar в DevTools
    3. Выбрать разрешение iPhone (390px), посмотреть панель фильтров и каталог
    4. Выбрать разрешение Samsung (360px)
    5. Добавить товары в корзину
    6. Открыть корзину и посмотреть верстку добавленных позиций  товаров
  expected-result: |
    На всех мобильных разрешениях:
    - панель фильтров/категорий доступна и корректно отображается
    - вёрстка каталога и корзины не ломается
  actual-result: |
    На мобильных разрешениях полностью исчезла панель фильтров и категорий
    На iPhone (390px) вёрстка каталога и корзины в целом стала лучше
    На Samsung (360px) поехала вёрстка корзины
    Скриншоты: screenshots/mobile-nofilters.png

- summary: |
    Иконки языков полностью убраны, остался только текстовый список
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Посмотреть переключатель языка в шапке
  expected-result: |
    Для каждого языка отображается соответствующая иконка (флаг + название языка)
  actual-result: |
    Иконки языков полностью отсутствуют
    Отображается только текстовый список языков без визуальных обозначений
    Скриншоты: screenshots/no-language-icon.png

- summary: |
    В фильтрах отображаются пустые значения: пустой чекбокс бренда и пустая строка в категориях
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Посмотреть список категорий
    3. Посмотреть список брендов
  expected-result: |
    В фильтрах категорий и брендов отображаются только реальные значения
    Пустых строк и пустых чекбоксов нет
  actual-result: |
    В списке брендов по-прежнему есть пустой чекбокс
    В списке категорий появилась пустая строка
    Скриншоты: screeshots/empty-checkbox-and-category-in-filters.png

- summary: |
    Кнопка Магазин / Store вызывает полную перезагрузку страницы
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Открыть DevTools - Network, включить Preserve log, очистить список запросов
    3. Нажать Магазин / Store в шапке
  expected-result: |
    Переход происходит без перезагрузки страницы
    В Network не появляется новый запрос типа document
  actual-result: |
    При нажатии Магазин страница полностью перезагружается
    В Network появляется запрос document

- summary: |
    После очистки корзины товары восстанавливаются при навигации и обновлении страницы
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    ОС Windows 10
    Сайт: https://products-store-v2-ru.hexlet.app/
  steps-to-reproduce: |
    1. Добавить товары в корзину
    2. Открыть корзину
    3. Нажать Очистить корзину / Clear cart
    4. Перейти в каталог или обновить страницу
    5. Открыть корзину
  expected-result: |
    После очистки корзина остаётся пустой
  actual-result: |
    Сразу после очистки корзина пустая
    После перехода по сайту или обновления страницы товары снова появляются в корзине

- summary: |
    Фильтр "В наличии" не фильтрует товары
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    ОС Windows 10
    Сайт: https://products-store-v2-ru.hexlet.app/
  steps-to-reproduce: |
    1. Открыть каталог
    2. Включить фильтр "В наличии"
  expected-result: |
    В каталоге отображаются только товары в наличии
  actual-result: |
    Без фильтра в каталоге отображаются товары в наличии
    После включения фильтра список товаров не меняется
    Фильтр по наличию не применяется
