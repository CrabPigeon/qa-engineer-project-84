---
test-cases:
- summary: "Проверка работы мобильной версии"
  status: fail(for mobile)
- summary: "Успешное оформление заказа"
  status: fail
bugreports:
- summary: |
    На мобильных разрешениях пропала панель фильтров, на узких экранах ломается вёрстка корзины
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Разрешения: iPhone (390×852), Samsung (360×780)
  steps-to-reproduce: |
    1. Открыть сайт
    2. Включить Device Toolbar в DevTools
    3. Выбрать разрешение iPhone (390px) и посмотреть каталог
    4. Выбрать разрешение Samsung (360px) и открыть корзину
  expected-result: |
    На всех мобильных разрешениях:
    - панель фильтров/категорий доступна и корректно отображается
    - вёрстка каталога и корзины не ломается
  actual-result: |
    - На мобильных разрешениях полностью исчезла панель фильтров и категорий
    - На iPhone (390px) вёрстка каталога и корзины в целом стала лучше
    - На Samsung (360px) вёрстка корзины поехала

- summary: |
    По-прежнему при оформлении заказа в консоли появляется ошибка HTTP 500
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-v2.hexlet.app/
    2. Добавить любой товар в корзину
    3. Перейти в корзину
    4. Нажать кнопку Оформить заказ / Checkout
    5. Открыть DevTools - Console
  expected-result: |
    Заказ оформляется без ошибок.
    В консоли отсутствуют ошибки выполнения скриптов и HTTP запросов.
    Появляется модальное окно с сообщением об успешном оформлении заказа.
  actual-result: |
    Появляется модальное окно Заказ успешно оформлен / Order placed successfully.
    В консоли DevTools отображается ошибка: XHR POST https://products-store-v2.hexlet.app/api/orders [HTTP/2 500 150ms]

- summary: |
    В фильтрах отображаются пустые значения: пустой чекбокс бренда и пустая строка в категориях
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-v2.hexlet.app/
    2. Посмотреть список категорий
    3. Посмотреть список брендов
  expected-result: |
    В фильтрах категорий и брендов отображаются только реальные значения.
    Пустых строк и пустых чекбоксов нет.
  actual-result: |
    - В списке брендов по-прежнему есть пустой чекбокс
    - В списке категорий появилась пустая строка
    
- summary: |
    После клика В корзину/Add to cart клавиши Space и Enter продолжают добавлять товар
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Нажать мышкой кнопку Add to cart на любом товаре
    2. Не кликая в другое место, нажать Space или Enter на клавиатуре
  expected-result: |
    После клика фокус не должен оставаться на кнопке, либо повторное нажатие Space/Enter не должно добавлять товар.
  actual-result: |
    Фокус остаётся на кнопке В корзину/Add to cart.
    Нажатие Space или Enter добавляет товар в корзину по одному.
