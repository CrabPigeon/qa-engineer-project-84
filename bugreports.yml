- summary: |
    Крестик не закрывает окно оформления заказа
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    ОС Windows 10
    Сайт: https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Добавить товар в корзину
    2. Открыть корзину
    3. Нажать Оформить заказ / Checkout
    4. Нажать крестик на окне оформления заказа
  expected-result: |
    Окно оформления заказа закрывается
  actual-result: |
    По нажатию на крестик окно не закрывается
    Окно закрывается только кнопкой Закрыть / Close

- summary: |
    После очистки корзины товары восстанавливаются при жёстком обновлении страницы (Ctrl+F5)
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    ОС Windows 10
    Сайт: https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Добавить товары в корзину
    2. Открыть корзину
    3. Нажать Очистить корзину / Clear cart
    4. Выполнить жёсткое обновление страницы (Ctrl+F5)
    5. Открыть корзину
  expected-result: |
    После очистки корзина остаётся пустой
  actual-result: |
    Сразу после очистки корзина пустая
    После Ctrl+F5 товары снова появляются в корзине
