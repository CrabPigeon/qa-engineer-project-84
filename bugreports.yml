---
- summary: |
    Ломается вёрстка на мобильных разрешениях: панель поиска/фильтров, карточки товаров
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-ru.hexlet.app/
    Разрешения: iPhone 16 (393×852), Galaxy S25 (360×780) и другие мобильные
  steps-to-reproduce: |
    1. Открыть сайт 
    2. Открыть DevTools - Device Toolbar
    3. Выбирать мобильное разрешение (iPhone 16 или Galaxy S25)
  expected-result: |
    На мобильных разрешениях все элементы интерфейса корректно помещаются на экран
    Текст в панели поиска/фильтров/категорий читаемый и не обрезается
    Карточки товаров отображаются рядом с панелью без наложения, не уезжают за пределы экрана
  actual-result: |
    На мобильных разрешениях ломается вёрстка:
    - в панели с поиском, фильтрами и категориями не влезает текст
    - карточки товаров не помещаются одновременно с панелью и уезжают вниз за пределы видимой области
    Скриншоты: screenshots/Samsung-resolution.png, screenshots/iphone-resolution.png

- summary: | На мобильных разрешениях ломается вёрстка корзины
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-ru.hexlet.app/
    Разрешения: iPhone 16 (393×852), Galaxy S25 (360×780) и другие мобильные
  steps-to-reproduce: |
    1. Открыть сайт
    2. Включить Device Toolbar в DevTools
    3. Выбрать мобильное разрешение
    4. Добавить товары в корзину
    5. Открыть корзину
  expected-result: |
    Верстка списка добавленных товаров в корзине не ломается
  actual-result: |
    На собильных разрешениях ломается верстка добавленных товаров в корзине
    Скриншоты: screenshots/iphone-resolution-cart.png, screenshots/Samsung-resolution-kart.png
    
- summary: |
    При оформлении заказа не переходит на страницу оплаты, в консоли появляется ошибка HTTP 500
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Добавить любой товар в корзину
    3. Перейти в корзину
    4. Нажать кнопку Оформить заказ / Checkout
    5. Открыть DevTools - Console
  expected-result: |
    Происходит переход на страницу оплаты
    В консоли отсутствуют ошибки выполнения скриптов и HTTP запросов
  actual-result: |
    Страница оплаты не открывается.
    Появляется модальное окно Заказ успешно оформлен / Order placed successfully
    В консоли DevTools отображается ошибка: XHR POST https://products-store-v2.hexlet.app/api/orders [HTTP/2 500 150ms]
    Скриншоты: screenshots/post-500.png

- summary: |
    При переключении страниц каталога изменяется содержимое фильтров категорий и брендов
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Запомнить доступные категории и бренды
    3. Нажать кнопку Next / Следующая
  expected-result: |
    Список категорий и брендов остается неизменным при переключении страниц
    Фильтры показывают все доступные варианты, а не только те, что есть на странице
  actual-result: |
    При переходе на следующую страницу список категорий и набор брендов полностью меняются
    Отображаются только те категории и бренды, которые соответствуют товарам на странице

