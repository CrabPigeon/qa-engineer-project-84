- summary: |
    Фильтр по цене не находит товар ни по цене без скидки, ни по цене со скидкой
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    ОС Windows 10
    Сайт: https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Открыть каталог
    2. Найти товар "Essence Mascara Lash Princess" (цена без скидки 9.99, со скидкой 8.94)
    3. В фильтре цены указать диапазон от 0 до 8.94
    4. В фильтре цены указать диапазон от 0 до 9.99
  expected-result: |
    Товар с ценой в заданном диапазоне отображается в каталоге
  actual-result: |
    Товар не находится ни по цене 9.99, ни по цене 8.94
    Фильтр по цене работает некорректно

