- summary: |
    Некорректное округление итоговой суммы в корзине при нескольких товарах со скидкой
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Добавить в корзину несколько товаров со скидкой (например с ценами 8.94 и 16.35)
    3. Открыть корзину
  expected-result: |
    Итоговая сумма рассчитывается точно (8.96 и 16.36 = 25.32)
  actual-result: |
    Сумма округляется некорректно (отображается 25.33)

- summary: |
    После клика В корзину/Add to cart клавиши Space и Enter продолжают добавлять товар
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Нажать мышкой кнопку Add to cart на любом товаре
    3. Не кликая в другое место, нажать Space или Enter на клавиатуре
  expected-result: |
    После клика фокус не должен оставаться на кнопке, либо повторное нажатие Space/Enter не должно добавлять товар
  actual-result: |
    Фокус остаётся на кнопке В корзину/Add to cart
    Нажатие Space или Enter добавляет товар в корзину по одному

