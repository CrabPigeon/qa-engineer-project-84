- summary: |
    При смене языка не переводятся названия категорий и описания товаров
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-ru.hexlet.app/
    2. Переключить язык интерфейса на русский
    3. Посмотреть названия категорий и описания товаров
  expected-result: |
    При смене языка переводится весь интерфейс, включая названия категорий, названия товаров и их описания.
  actual-result: |
    Названия категорий и описания товаров только на английском языке.

- summary: |
    Отсутствует иконка для английского языка, вместо неё повторно отображается текст "English"
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-ru.hexlet.app/
    2. Посмотреть переключатель языка в шапке
  expected-result: |
    Для каждого языка отображается соответствующая иконка (флаг + название языка).
  actual-result: |
    Для английского языка отсутствует иконка.
    Вместо иконки повторно отображается текст 'English'.

- summary: |
    Некорректное отображение цен в корзине: цена за единицу без скидки (зачеркнутое число), итоговая сумма со скидкой
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-ru.hexlet.app/
    2. Добавить в корзину товар, у которого есть скидка
    3. Открыть корзину
    4. Посмотреть цену за единицу, сумму по позиции и итоговую сумму
  expected-result: |
    Все цены в корзине отображаются последовательно и понятно.
    Итоговая сумма должна логично складываться из указанных цен товаров.
  actual-result: |
    Цена за единицу указана без скидки (зачеркнутое число), а итоговая суммы — со скидкой.
    Расчет итоговой суммы остаётся неочевидным.
    Скриншоты: screenshots/mixed-prices.png

