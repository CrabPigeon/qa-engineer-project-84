    При применении фильтров каталог содержит пустые страницы
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-ru.hexlet.app/
    2. Выбрать любой фильтр (категорию или бренд)
    3. Переключать страницы кнопкой Следующая / Next
