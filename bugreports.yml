- summary: |
    Некорректное отображение цен в корзине: цена за единицу без скидки (зачеркнутое число), итоговая сумма со скидкой
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Версия сайта https://products-store-ru.hexlet.app/
  steps-to-reproduce: |
    1. Открыть сайт
    2. Добавить в корзину товар, у которого есть скидка
    3. Открыть корзину
  expected-result: |
    Все цены в корзине отображаются последовательно и понятно
    Итоговая сумма должна логично складываться из указанных цен товаров
  actual-result: |
    Цена за единицу указана без скидки (зачеркнутое число), а итоговая суммы — со скидкой
    Расчет итоговой суммы остаётся неочевидным
    Скриншоты: screenshots/mixed-prices.png

