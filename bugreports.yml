---
- summary: |
    Ломается вёрстка на мобильных разрешениях: панель поиска/фильтров и карточки товаров
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Разрешения: iPhone 16 (393×852), Galaxy S25 (360×780) и другие мобильные
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-ru.hexlet.app/
    2. Открыть DevTools - Device Toolbar
    3. Выбирать мобильное разрешение (iPhone 16 или Galaxy S25)
    4. Область с карточками товаров и левая панель поиска (панель поиска, категории и фильтры)
  expected-result: |
    На мобильных разрешениях все элементы интерфейса корректно помещаются на экран.
    Текст в панели поиска/фильтров/категорий читаемый и не обрезается.
    Карточки товаров отображаются рядом с панелью без наложения, не уезжают за пределы экрана.
  actual-result: |
    На мобильных разрешениях ломается вёрстка:
    - в панели с поиском, фильтрами и категориями не влезает текст
    - карточки товаров не помещаются одновременно с панелью и уезжают вниз за пределы видимой области

- summary: |
    При оформлении заказа в консоли появляется ошибка HTTP 500
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт https://products-store-ru.hexlet.app/
    2. Добавить любой товар в корзину
    3. Перейти в корзину
    4. Нажать кнопку Оформить заказ / Checkout
    5. Открыть DevTools - Console
  expected-result: |
    Заказ оформляется без ошибок.
    В консоли отсутствуют ошибки выполнения скриптов и HTTP запросов.
    Появляется модальное окно с сообщением об успешном оформлении заказа.
  actual-result: |
    Появляется модальное окно Заказ успешно оформлен / Order placed successfully.
    В консоли DevTools отображается ошибка: XHR POST https://products-store-v2.hexlet.app/api/orders [HTTP/2 500 150ms]

- summary: |
    При переключении страниц каталога изменяется содержимое фильтров категорий и брендов
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. Область поиска и фильтров на левой панели
    3. Посмотреть доступные категории и бренды
    4. Нажать кнопку Next / Следующая
    5. Снова посмотреть список категорий и брендов
  expected-result: |
    Список категорий и брендов остается неизменным при переключении страниц.
    Фильтры показывают все доступные варианты, а не только те, что есть на странице.
  actual-result: |
    При переходе на следующую страницу список категорий и набор брендов полностью меняются.
    Отображаются только те категории и бренды, которые соответствуют товарам на странице.

- summary: |
    Непонятное числовое значение на карточке товара
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. Посмотреть на любую карточку товара
    3. Числовое значение перед кнопкой Добавить
    4. Добавить этот товар в корзину несколько раз
    5. Открыть корзину и посмотреть количество
  expected-result: |
    На карточке товара понятно, что означает числовое значение (остаток на складе, количество отзывов и т.д.).
    Либо число подписано, либо отсутствует.
  actual-result: |
    На карточках товаров отображаются числа (например 84, 33), назначение которых неясно.
    В корзине число подписано как шт(qt), но количество товаров увеличивается по числу кликов.

- summary: |
    Фильтр цены отображает отрицательные и дробные значения
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. Найти фильтр по цене (поле 'От - До:') 
    3. Посмотреть доступные значения фильтра
  expected-result: |
  Возможно ввести только целые положительные значения в разумном диапозоне.
  actual-result: |
  Фильтр цены позволяет вводить отрицательные и дробные значения.

- summary: |
    При применении фильтров пагинация показывает пустые страницы
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. Выбрать любой фильтр (категорию или бренд)
    3. Переключать страницы кнопкой Следующая / Next
  expected-result: |
    В каталоге отсутствуют пустые страницы.
  actual-result: |
    При применеии фильтров каталог содержит пустые страницы.

- summary: |
    При смене языка не переводятся названия категорий и описания товаров
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт
    2. Переключить язык интерфейса 
    3. Посмотреть названия категорий в фильтре
    4. Посмотреть названия и описания товаров в каталоге и на странице товара
  expected-result: |
    При смене языка переводится весь интерфейс, включая названия категорий, названия товаров и их описания.
  actual-result: |
    Переключается только часть интерфейса (кнопки, некоторые элементы).
    Названия категорий и содержание карточек товаров только на английском.

- summary: |
    Отсутствует иконка для английского языка, вместо неё повторно отображается текст "English"
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть сайт
    2. Посмотреть переключатель языка в шапке
  expected-result: |
    Для каждого языка отображается соответствующая иконка (флаг + название языка).
  actual-result: |
    Для английского языка отсутствует иконка.
    Вместо иконки повторно отображается текст "English".

- summary: |
    Некорректное отображение цен в корзине: цена за единицу без скидки, итоговые суммы со скидкой
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Добавить в корзину товар, у которого есть скидка
    2. Открыть корзину
    3. Посмотреть цену за единицу товара, промежуточную сумму и итоговую сумму
  expected-result: |
    Все цены в корзине отображаются последовательно и понятно.
    Итоговая сумма должна логично складываться из цен товаров.
  actual-result: |
    Цена за единицу товара указана без скидки. Сумма по позициям и общая сумма указаны со скидкой.

- summary: |
    Процент скидки на странице товара отображается в виде числа с плавающей точкой
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть каталог товаров
    2. Найти товар со скидкой
    3. Посмотреть, размер скидки на странице товара
  expected-result: |
    Процент скидки отображается в привычном виде (например 15%).
  actual-result: |
    Процент скидки отображается в виде числа с плавающей точкой (15.415%).

- summary: |
    Ссылка на категорию на странице товара не работает
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Открыть любую страницу товара
    2. Найти указание категории (оформлено как ссылка вида #категория)
    3. Нажать на ссылку
  expected-result: |
    При нажатии на категорию происходит переход к списку товаров этой категории и применяется соответствующий фильтр.
  actual-result: |
    Ссылка на категорию визуально выглядит кликабельной, но при нажатии ничего не происходит.

- summary: |
    Корзина не очищается после успешного оформления заказа
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
  steps-to-reproduce: |
    1. Добавить товары в корзину
    2. Перейти в корзину и нажать Оформить заказ / Checkout 
    3. Закрыть окно оформления
    4. Посмотреть содержимое корзины и счётчик на иконке
  expected-result: |
    После успешного оформления заказа корзина должна очищаться.
  actual-result: |
    Товары остаются в корзине, счётчик на иконке не сбрасывается.
