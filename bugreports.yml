---
- summary: |
    Ломается вёрстка на мобильных разрешениях: панель поиска/фильтров и карточки товаров
  environment: |
    Google Chrome 151.0.7922.138 (Official Build) (64-bit)
    OC Windows 10
    Разрешения: iPhone 16 (393×852), Galaxy S25 (360×780) и другие мобильные
  steps-to-reproduce: |
    1. Открываем сайт https://products-store-ru.hexlet.app/
    2. Открываем DevTools - Device Toolbar
    3. Выбираем мобильное разрешение (iPhone 16 или Galaxy S25)
    4. Область с карточками товаров и левая панель поиска (панель поиска, категории и фильтры)
  expected-result: |
    На мобильных разрешениях все элементы интерфейса корректно помещаются на экран.
    Текст в панели поиска/фильтров/категорий читаемый и не обрезается.
    Карточки товаров отображаются рядом с панелью без наложения, не уезжают за пределы экрана.
  actual-result: |
    На мобильных разрешениях ломается вёрстка:
    - в панели с поиском, фильтрами и категориями не влезает текст
    - карточки товаров не помещаются одновременно с панелью и уезжают вниз за пределы видимой области
