---
- summary: "Успешный поиск товара по ключевому слову"
  requirements: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    На сайте присутствуют товары с названием и описанием
  test-data: |
    Ключевое слово = "Eyeshadow"
  steps:
    - Ввести ключевое слово в строку поиска
  expected-result: |
    Отображаются товары, соответствующие ключевому слову

- summary: "Успешный поиск товара по категории"
  requirements: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    На сайте присутствуют категории товаров
  test-data: |
    Название категории: "groceries"
  steps:
    - В навигации в выпадающем списке 'Category' выбрать 'groceries'
  expected-result: |
    Отображаются все товары, принадлежащие категории 'groceries'

- summary: "Успешное применение фильтров"
  requirements: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    На панели навигации доступны элементы фильтрации
  test-data: |
    Фильтры: категория 'beauty', бренд 'essence'
  steps:
    - Выбрать категорию 'beauty'
    - Выбрать бренд 'Essence'
  expected-result: |
    Отображаются только товары, соответствующие выбранным фильтрам

- summary: "Успешное добавление товаров в корзину"
  requirements: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites: |
    На сайте присутствуют товары
  test-data: |
    Товар 1 = "Essence Mascara Lash Princess"
    Товар 2 = "Eyeshadow Palette with Mirror"
  steps:
    - Найти Товар 1 на странице каталога или через строку поиска
    - Нажать кнопку 'Add to cart'
    - Повторить для Товар 2
    - Перейти в корзину по кнопке "Cart"
  expected-result: |
    Оба товара успешно добавлены в корзину.
    В корзине отображаются выбранные товары с количеством, ценой за единицу и общей суммой.
    Иконка корзины показывает количество добавленных позиций.

- summary: "Успешное переключение языка интерфейса"
  requirements: |
    Сайт должен иметь локализацию (перевод) на русский и английский языки
  prerequisites: |
    Локализация на русский и английский языки
  steps:
    - Найти переключатель языка в шапке сайта
    - Переключить на русский язык
    - Переключить на английский язык
  expected-result: |
    При переключении на русский интерфейс и описание товаров отображаются на русском языке
    При переключении на английский интерфейс и описание товаров отображаются на английском языке
    Функциональность сохраняется после переключения языка

- summary: "Проверка работы мобильной версии"
  requirements: |
    Сайт должен иметь мобильную версию. Сайт должен быть доступен на различных устройствах.
    Корректное отображение верстки на всех устройствах (адаптивность)
  test-data: |
    Разрешения экрана:
      - iPhone 16 (393 × 852)
      - iPad (768x1024)
      - Galaxy S25 (360 x 780)
      - Desktop (1920x1080)
  steps:
    - В браузере переключить DevTools в режим мобильного устройства
    - Открыть главную страницу каталога
    - Повторить для планшетного и desktop разрешений
  expected-result: |
    Сайт корректно адаптируется под все выбранные разрешения и устройства.
    Все функциональные элементы доступны и удобны для использования.
    Верстка не ломается

- summary: "Совместимость с последними версиями браузеров"
  requirements: |
    Сайт нужно протестировать на совместимость с последними версиями браузеров
  prerequisites: |
    Доступ к последним версиям браузеров: Google Chrome, Mozilla Firefox, Microsoft Edge, Safari
  test-data: |
    Latest stable версии браузеров на момент тестирования
  steps:
    - Открыть консоль браузера
    - Выполнить основные сценарии: поиск, фильтрация, просмотр товара, добавление в корзину, смена языка
    - Повторить те же сценарии в Mozilla Firefox, Microsoft Edge и Safari
  expected-result: |
    Сайт работает корректно во всех проверенных браузерах.
    Отсутствуют критические различия в верстке или функциональности.
    Нет ошибок JavaScript в консоли

- summary: "Неудачный поиск по ключевому слову"
  requirements: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites: |
    На сайте отсутствует товар по тестовому запросу
  test-data: |
    Ключевое слово: 'FaildTest'
  steps:
    - Ввести ключевое слово в строку поиска
  expected-result: |
    Отображается сообщение об отсутствии результатов

- summary: "Проверка 'code injection'"
  requirements: |
    Сайт должен быть безопасным и защищать данные пользователя
  prerequisites: |
    Функция поиска активна
  test-data: |
    Вредоносный запрос = "<script>console.log('Injection')</script>"
  steps:
    - Ввести в поле поиска строку Вредоносный запрос
    - Открыть консоль браузера
  expected-result: |
    Скрипт не выполняется

- summary: "Сохранение корзины в сессии браузера"
  requirements: |
    Сайт должен сохранять корзину с выбранными товарами в сессии браузера
  prerequisites: |
    Корзина на сайте использует sessionStorage
  test-data: |
    Товар 1 = "Essence Mascara Lash Princess"
  steps:
    - Добавить Товар 1 в корзину
    - Обновить текущую страницу
    - Перейти в корзину
  expected-result: |
    После обновления страницы содержимое корзины сохраняется
    Навигация по сайту не приводит к потере корзины

- summary: "Успешное удаление товара из корзины"
  requirements: |
    Пользователь должен иметь возможность удалять ранее добавленные товары из корзины
  prerequisites: |
    В корзину добавлен товар, счетчик на иконке корзины показывает 1
  test-data: |
    Товар 1 = "Essence Mascara Lash Princess"
  steps:
    - Заходим в корзину
    - Нажимаем кнопку Удалить/Delete напротив Товар 1
  expected-result: |
    В корзине нет Товар 1, сумма равна 0, счётчик на иконке корзины отсутствует

- summary: "Успешное оформление заказа"
  requirements: |
    Пользователь должен иметь возможность оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзину добавлен товар, счетчик на иконке корзины показывает 1
  test-data: |
    Товар 1 = "Essence Mascara Lash Princess"
  steps:
    - Заходим в корзину
    - Нажимаем кнопку Оформить заказ/Checkout
  expected-result: |
    Происходит переход на страницу оплаты

- summary: "Успешное продолжение выбора товаров из корзины"
  requirements: |
    Пользователь должен иметь возможность продолжить выбор товаров из корзины
  prerequisites: |
    Находимся в корзине, в корзину добавлен товар, счетчик на иконке корзины показывает 1
  test-data: |
    Товар 1 = "Essence Mascara Lash Princess"
  steps:
    - Нажимаем кнопку Продолжить покупки/Continue shopping
  expected-result: |
    Попадаем на страницу каталога, счетчик на иконке корзины показывает 1

- summary: "Отображение информации на странице товара"
  requirements: |
    На странице товара и в каталоге должны отображаться название, рейтинг, цена со скидкой и без скидки
  prerequisites: |
    На сайте присутствуют товары с названием и описанием
  test-data: |
    Товар 1 = "Essence Mascara Lash Princess"
  steps:
    - Открыть страницу каталога
    - Нажать на карточку Товара 1
  expected-result: |
    На странице товара корректно отображаются название, рейтинг, цена и цена со скидкой.

- summary: "Отображение информации на карточке товара в каталоге"
  requirements: |
    На странице товара и в каталоге должны отображаться название, рейтинг, цена со скидкой и без скидки
  prerequisites: |
    На сайте присутствуют товары с названием и описанием
  test-data: |
    Товар 1 = "Essence Mascara Lash Princess"
  steps:
    - Открыть страницу каталога
    - Найти карточку Товара 1
  expected-result: |
    На карточке товара корректно отображаются название, рейтинг, цена и цена со скидкой.

- summary: "Отображение постраничного вывода без активных фильтров и категорий"
  requirements: |
    Сайт должен иметь постраничный вывод согласно выбранным фильтрам и категориям
  prerequisites: |
    На сайте присутствуют товары с названием и описанием
  steps:
    - Заходим на страницу каталога
    - Запоминаем изначальный набор товаров
    - Нажимаем кнопку Следующая/Next
    - Нажимаем кнопку Предыдущая/Previous
  expected-result: |
    Кнопки Следующая/Next и Предыдущая/Previous работают корректно. Товары меняются при переходе на другую страницу.

- summary: "Отображение постраничного вывода согласно выбранным фильтрам и категориям"
  requirements: |
    Сайт должен иметь постраничный вывод согласно выбранным фильтрам и категориям
  prerequisites: |
    На сайте присутствуют товары с названием и описанием. На сайте присутствуют категории товаров. Товары привязаны к категориям.
  test-data: |
    Категория = Beauty
    Бренд = Essence
  steps:
    - Заходим на страницу каталога
    - Выбираем категорию Beauty и бренд Essence
    - Запоминаем изначальный набор товаров
    - Нажимаем кнопку Следующая/Next
    - Нажимаем кнопку Предыдущая/Previous
  expected-result: |
    Кнопки Следующая/Next и Предыдущая/Previous работают корректно.
    Товары меняются при переходе на другую страницу и соответствуют выбранным фильтрам и категориям.

- summary: "Успешная проверка работы сайта без перезагрузки страницы"
  requirements: |
    Сайт не должен перезагружать страницу при взаимодействии с элементами интерфейса
  steps:
    - В браузере открываем DevTools - Network
    - Включаем Preserve log, очищаем список запросов
    - Переключаем страницы товаров каталога
    - Добавляем товар в корзину
    - Открываем карточку товара
    - Переключаем язык
    - Переходим в корзину
    - Возвращаемся на страницу каталога
    - Проверяем список запросов в Network
  expected-result: |
    Взаимодействие с элементами на сайте не приводит к перезагрузке страницы. В DevTools - Network не появляется запрос с типом document.
